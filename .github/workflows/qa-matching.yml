name: QA Quiz Formation V23.1

on:
  push:
    branches:
      - dev-matching-v23-1-20261121
  pull_request:
    branches:
      - dev-backup-portable-20261121

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile all application and utility modules
        run: |
          python -m compileall -q app.py utils tests
      - name: Run application regression tests
        run: |
          python -m pytest tests -q --tb=short
